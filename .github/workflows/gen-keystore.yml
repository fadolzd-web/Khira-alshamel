name: gen-keystore
on: [workflow_dispatch]
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate new keystore with your password
        run: |
          keytool -genkey -v -keystore mykey.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass Fadel03906563 -keypass Fadel03906563 -dname "CN=Khira Al Shamel, OU=Dev, O=Fadol, L=Tripoli, S=North, C=LB"
          base64 -w 0 mykey.jks > keystore_base64.txt
          ls -lh mykey.jks keystore_base64.txt
          echo "Password is: Fadel03906563"
          echo "Alias is: mykey"
      - uses: actions/upload-artifact@v4
        with:
          name: NEW-KEYSTORE-Fadel03906563-KEEP-SAFE
          path: |
            mykey.jks
            keystore_base64.txt
