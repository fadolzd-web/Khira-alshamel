name: build-signed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: |
          mkdir -p www
          [ -d dist ] && cp -r dist/* www/ || true
          cp index.html www/ 2>/dev/null || echo "<html>Khira</html>" > www/index.html
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Icon
        run: |
          if [ -f icon.png ]; then for d in android/app/src/main/res/mipmap-*; do cp icon.png $d/ic_launcher.png 2>/dev/null || true; cp icon.png $d/ic_launcher_round.png 2>/dev/null || true; done; fi
      - name: Generate Keystore Fadel03906563
        run: |
          rm -f android/app/mykey.jks
          keytool -genkeypair -keystore android/app/mykey.jks -storepass Fadel03906563 -keypass Fadel03906563 -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Khira, OU=Khira, O=Khira, L=Tripoli, C=LB"
          ls -lh android/app/mykey.jks
      - name: Build UNSIGNED Release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease -x validateSigningRelease || ./gradlew assembleRelease -Dorg.gradle.warning.mode=none || true
          find app/build/outputs -name "*.apk" | head
      - name: SIGN MANUALLY with Fadel03906563
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "Using $BUILD_TOOLS"
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK: $APK"
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks android/app/mykey.jks --ks-pass pass:Fadel03906563 --key-pass pass:Fadel03906563 --ks-key-alias mykey --out android/app/build/outputs/apk/release/Khira-SIGNED-Fadel03906563.apk $APK
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --print-certs android/app/build/outputs/apk/release/Khira-SIGNED-Fadel03906563.apk
          ls -lh android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Khira-SIGNED-Fadel03906563-FINAL
          path: android/app/build/outputs/apk/release/Khira-SIGNED-Fadel03906563.apk
