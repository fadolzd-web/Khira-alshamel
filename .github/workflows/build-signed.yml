name: build-signed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Find icon file (khira.png or iconp.png or icon.png)
        run: |
          ICON=$(ls khira.png iconp.png icon.png app-icon.png 2>/dev/null | head -1)
          if [ -z "$ICON" ]; then echo "❌ ما لقيت أي أيقونة!"; ls *.png; exit 1; fi
          echo "✅ لقيت الأيقونة: $ICON size $(wc -c < $ICON) bytes"
          echo "ICON_FILE=$ICON" >> $GITHUB_ENV
      - run: npm install
      - run: |
          mkdir -p www
          [ -d dist ] && cp -r dist/* www/ || true
          cp index.html www/ 2>/dev/null || echo "<html>Khira</html>" > www/index.html
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Inject YOUR icon (khira.png) to Android
        run: |
          echo "Using $ICON_FILE"
          for d in android/app/src/main/res/mipmap-*; do
            [ -d "$d" ] && cp "$ICON_FILE" "$d/ic_launcher.png" && cp "$ICON_FILE" "$d/ic_launcher_round.png" && echo "Injected $d"
          done
      - name: Generate Keystore Fadel03906563
        run: keytool -genkeypair -keystore android/app/mykey.jks -storepass Fadel03906563 -keypass Fadel03906563 -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Khira, OU=Khira, O=Khira, L=Tripoli, C=LB"
      - name: Build & Sign APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease
          TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          $ANDROID_HOME/build-tools/$TOOLS/apksigner sign --ks app/mykey.jks --ks-pass pass:Fadel03906563 --key-pass pass:Fadel03906563 --ks-key-alias mykey --out app/build/outputs/apk/release/Khira-SIGNED-khira.png.apk $APK
      - uses: actions/upload-artifact@v4
        with:
          name: Khira-APK-khira-icon
          path: android/app/build/outputs/apk/release/*.apk
