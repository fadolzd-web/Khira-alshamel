name: build-signed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      
      - run: npm install
      
      - name: Prepare web assets
        run: |
          npm run build || true
          mkdir -p www
          [ -d dist ] && cp -r dist/* www/ || true
          [ -f index.html ] && cp index.html www/ || true
          [ -d assets ] && cp -r assets www/ || true
          ls www/
      
      - run: npx cap add android || true
      - run: npx cap sync android

      - name: Inject Khira Icon
        run: |
          if [ -f icon.png ]; then
            echo "Found icon.png, injecting into Android"
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                cp icon.png "$d/ic_launcher.png" || true
                cp icon.png "$d/ic_launcher_round.png" || true
                cp icon.png "$d/ic_launcher_foreground.png" || true
              fi
            done
            cp icon.png android/app/src/main/res/drawable/ic_launcher.png 2>/dev/null || mkdir -p android/app/src/main/res/drawable && cp icon.png android/app/src/main/res/drawable/ic_launcher.png
          else
            echo "icon.png not found, using default"
          fi

      - name: Build Signed Fadel03906563
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mykey.jks
          echo "storeFile=mykey.jks" > android/app/key.properties
          echo "storePassword=Fadel03906563" >> android/app/key.properties
          echo "keyAlias=mykey" >> android/app/key.properties
          echo "keyPassword=Fadel03906563" >> android/app/key.properties
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Khira-ICON-SIGNED-APK
          path: android/app/build/outputs/apk/release/*.apk
