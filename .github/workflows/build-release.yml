name: build-signed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      
      - run: npm install
      
      - name: Build web assets
        run: |
          npm run build || echo "no build script"
          mkdir -p www
          if [ -f dist/index.html ]; then cp -r dist/* www/; fi
          if [ ! -f www/index.html ]; then
            cp index.html www/ 2>/dev/null || true
            cp -r assets www/ 2>/dev/null || true
            cp -r src www/ 2>/dev/null || true
          fi
          ls -lh www/ | head -20
          if [ ! -f www/index.html ]; then echo "ERROR: www/index.html still missing"; exit 1; fi

      - run: npx cap add android || true
      - run: npx cap sync android

      - name: Build Signed with Fadel03906563
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mykey.jks
          echo "storeFile=mykey.jks" > android/app/key.properties
          echo "storePassword=Fadel03906563" >> android/app/key.properties
          echo "keyAlias=mykey" >> android/app/key.properties
          echo "keyPassword=Fadel03906563" >> android/app/key.properties
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Khira-SIGNED-Fadel03906563-APK
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khira-SIGNED-Fadel03906563-AAB
          path: android/app/build/outputs/bundle/release/*.aab
