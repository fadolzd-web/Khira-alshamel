name: build-signed
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare www folder from root files
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -r *.js *.css *.json *.png *.jpg *.jpeg www/ 2>/dev/null || true
          # إذا عندك ملفات تانية بالجذر انسخها
          cp -r assets www/ 2>/dev/null || true
          ls -la www/
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mykey.jks
      - name: Create key.properties
        run: |
          echo "storeFile=mykey.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew bundleRelease
      - run: cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
